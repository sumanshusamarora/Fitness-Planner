[project]
name = "musclewiki-scraper"
version = "0.1.0"
description = "Scrape MuscleWiki exercise data (name, muscles, instructions, videos, images) using scrapling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scrapling>=0.4.14",
    "curl-cffi>=0.16.0",
    "browserforge>=1.2.4",
    "playwright>=1.62.0",
]

[project.scripts]
musclewiki = "musclewiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["musclewiki"]
